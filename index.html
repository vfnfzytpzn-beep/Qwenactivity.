<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通义大模型生态赋能中心 - 活动资讯</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <div class="logo-icon">通</div>
            <div class="logo-text-wrap">
                <span class="logo-text">通义大模型生态赋能中心</span>
                <span class="logo-subtitle">全国首个集技术、运营、场景创新于一体的生态赋能中心</span>
            </div>
        </a>
        <div class="nav-links">
            <a href="index.html" class="active">活动首页</a>
            <a href="publish.html">发布活动</a>
            <a href="admin.html">后台管理</a>
            <a href="qwen.html">关于千问</a>
        </div>
    </nav>

    <!-- AI资讯滚动条 -->
    <div class="ai-news-bar">
        <div class="ai-news-inner">
            <div class="ai-news-label">
                <span class="pulse-dot"></span>
                AI 实时资讯
            </div>
            <div class="ai-news-track-wrapper">
                <div class="ai-news-track" id="aiNewsTrack">
                    <!-- 动态渲染 -->
                </div>
            </div>
        </div>
    </div>

    <!-- Hero轮播区域（层叠交错排版） -->
    <section class="hero-carousel-section">
        <!-- 标题区域（渐变蓝色背景） -->
        <div class="carousel-header-gradient">
            <div class="carousel-header-inner">
                <h2 class="carousel-title">精选活动</h2>
            </div>
        </div>
        
        <!-- 轮播视口 -->
        <div class="carousel-viewport-stacked">
            <div class="carousel-track-stacked" id="heroCarouselTrack">
                <!-- 动态渲染轮播卡片 -->
            </div>
            
            <!-- 左右箭头 -->
            <button class="carousel-nav-btn carousel-prev-btn" onclick="slidePrev()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <button class="carousel-nav-btn carousel-next-btn" onclick="slideNext()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
            
            <!-- 分页指示器 -->
            <div class="carousel-dots" id="carouselDots">
                <!-- 动态生成 -->
            </div>
        </div>
    </section>

    <!-- 更多模块入口 -->
    <div class="module-links">
        <div class="container">
            <a href="exhibitions.html" class="module-link-card">
                <div class="module-link-icon">🤖</div>
                <div class="module-link-info">
                    <h3>上海AI活动信息</h3>
                    <p>查看上海近期人工智能相关活动与论坛</p>
                </div>
                <span class="module-link-arrow">→</span>
            </a>
            <a href="zhangjiang.html" class="module-link-card card-green">
                <div class="module-link-icon">🏗️</div>
                <div class="module-link-info">
                    <h3>张江AI创新小镇</h3>
                    <p>探索张江科技创新活动</p>
                </div>
                <span class="module-link-arrow">→</span>
            </a>
        </div>
    </div>

    <!-- 搜索与筛选 -->
    <div class="container">
        <div style="display:flex; gap:12px; align-items:center; padding-top:30px; flex-wrap:wrap;">
            <input type="text" id="searchInput" class="form-control" placeholder="搜索活动名称..." style="max-width:300px;">
            <select id="categoryFilter" class="form-control" style="max-width:160px;">
                <option value="">全部分类</option>
                <option value="技术沙龙">技术沙龙</option>
                <option value="行业峰会">行业峰会</option>
                <option value="培训课程">培训课程</option>
                <option value="工作坊">工作坊</option>
                <option value="线上直播">线上直播</option>
            </select>
            <select id="statusFilter" class="form-control" style="max-width:140px;">
                <option value="">全部状态</option>
                <option value="active">报名中</option>
                <option value="ended">已结束</option>
            </select>
        </div>

        <h2 class="section-title">最新活动</h2>

        <!-- 活动列表 -->
        <div class="events-grid" id="eventsGrid">
            <!-- 动态渲染 -->
        </div>

        <!-- 空状态 -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <div class="empty-icon">📭</div>
            <h3>暂无相关活动</h3>
            <p>试试其他筛选条件，或<a href="publish.html" style="color:var(--primary);">发布新活动</a></p>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 通义大模型生态赋能中心 | 活动资讯平台</p>
        </div>
    </footer>

    <script src="events-data.js"></script>
    <script src="app.js"></script>
    <script>
        // 渲染AI资讯（数据来自app.js中的aiNewsData）
        function renderAiNews() {
            const track = document.getElementById('aiNewsTrack');
            const newsHTML = aiNewsData.map(item => `
                <div class="ai-news-item" onclick="location.href='news-detail.html?id=${item.id}'">
                    <span class="news-tag ${item.tagClass}">${item.tag}</span>
                    <span class="news-title">${item.title}</span>
                    <span class="news-time">${item.time}</span>
                </div>
            `).join('');
            // 复制一份实现无缝滚动
            track.innerHTML = newsHTML + newsHTML;
        }

        // 渲染活动列表
        function renderEvents() {
            const events = EventManager.getAll();
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const status = document.getElementById('statusFilter').value;

            let filtered = events.filter(e => {
                let match = true;
                if (keyword) match = match && e.title.toLowerCase().includes(keyword);
                if (category) match = match && e.category === category;
                if (status) match = match && e.status === status;
                return match;
            });

            const grid = document.getElementById('eventsGrid');
            const emptyState = document.getElementById('emptyState');

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            grid.innerHTML = filtered.map(event => `
                <div class="card event-card" onclick="location.href='detail.html?id=${event.id}'">
                    <div class="card-img">
                        ${event.cover 
                            ? `<img src="${event.cover}" alt="${event.title}">` 
                            : `<span>${Utils.getCategoryIcon(event.category)}</span>`
                        }
                    </div>
                    <div class="card-body">
                        <h3>${event.title}</h3>
                        <div class="card-meta">
                            <span>📅 ${event.date} ${event.time || ''}</span>
                            <span>📍 ${event.location}</span>
                            <span>👤 ${event.organizer || '通义大模型生态赋能中心'}</span>
                        </div>
                    </div>
                    <div class="card-footer">
                        <span class="tag">${event.category || '其他'}</span>
                        <span class="status ${event.status === 'active' ? 'status-active' : 'status-ended'}">
                            ${Utils.getStatusText(event.status)}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // 事件监听
        document.getElementById('searchInput').addEventListener('input', renderEvents);
        document.getElementById('categoryFilter').addEventListener('change', renderEvents);
        document.getElementById('statusFilter').addEventListener('change', renderEvents);

        // 初始化
        renderAiNews();
        renderEvents();
        
        // ========== Hero轮播功能（层叠交错排版）==========
        let currentSlideIndex = 0;
        let carouselSlides = [];
        const track = document.getElementById('heroCarouselTrack');
        const dotsContainer = document.getElementById('carouselDots');
        let autoPlayTimer = null;
        const SLIDE_INTERVAL = 3000; // 3秒停留

        // 获取精选活动数据（固定取前4个已发布活动）
        function getHeroCarouselData() {
            const allEvents = EventManager.getAll();
            return allEvents.slice(0, 4);
        }

        // 渲染轮播卡片（层叠样式）
        function renderHeroCarousel() {
            carouselSlides = getHeroCarouselData();
            
            if (carouselSlides.length === 0) {
                track.innerHTML = '<div class="empty-state"><p>暂无活动</p></div>';
                dotsContainer.innerHTML = '';
                return;
            }
            
            // 生成幻灯片HTML
            track.innerHTML = carouselSlides.map((event, index) => `
                <div class="carousel-slide-stacked" data-index="${index}" onclick="location.href='detail.html?id=${event.id}'">
                    ${event.cover 
                        ? `<img src="${event.cover}" alt="${event.title}" class="slide-image">` 
                        : `<div class="slide-image" style="background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); display:flex; align-items:center; justify-content:center; font-size:80px;">${Utils.getCategoryIcon(event.category)}</div>`
                    }
                    <div class="slide-overlay"></div>
                    <div class="slide-content">
                        <h3 class="slide-title">${event.title}</h3>
                    </div>
                </div>
            `).join('');
            
            // 生成分页指示器
            renderDots();
            
            // 初始化位置
            updateCarouselPosition();
            
            // 启动自动播放
            startAutoPlay();
        }

        // 渲染分页点
        function renderDots() {
            dotsContainer.innerHTML = carouselSlides.map((_, index) => `
                <div class="dot-indicator ${index === currentSlideIndex ? 'active' : ''}" 
                     onclick="goToSlide(${index})"></div>
            `).join('');
        }

        // 更新轮播位置（层叠效果）
        function updateCarouselPosition() {
            const slides = document.querySelectorAll('.carousel-slide-stacked');
            
            slides.forEach((slide, index) => {
                slide.classList.remove('active', 'prev', 'next', 'hidden');
                
                if (index === currentSlideIndex) {
                    slide.classList.add('active');
                } else if (index === (currentSlideIndex - 1 + carouselSlides.length) % carouselSlides.length) {
                    slide.classList.add('prev');
                } else if (index === (currentSlideIndex + 1) % carouselSlides.length) {
                    slide.classList.add('next');
                } else {
                    slide.classList.add('hidden');
                }
            });
            
            // 更新指示器
            document.querySelectorAll('.dot-indicator').forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlideIndex);
            });
        }

        // 切换到指定幻灯片
        function goToSlide(index) {
            currentSlideIndex = Math.max(0, Math.min(index, carouselSlides.length - 1));
            updateCarouselPosition();
            resetAutoPlay();
        }

        // 下一张
        function slideNext() {
            currentSlideIndex = (currentSlideIndex + 1) % carouselSlides.length;
            updateCarouselPosition();
            resetAutoPlay();
        }

        // 上一张
        function slidePrev() {
            currentSlideIndex = (currentSlideIndex - 1 + carouselSlides.length) % carouselSlides.length;
            updateCarouselPosition();
            resetAutoPlay();
        }

        // 启动自动播放
        function startAutoPlay() {
            stopAutoPlay();
            autoPlayTimer = setInterval(() => {
                slideNext();
            }, SLIDE_INTERVAL);
        }

        // 停止自动播放
        function stopAutoPlay() {
            if (autoPlayTimer) {
                clearInterval(autoPlayTimer);
                autoPlayTimer = null;
            }
        }

        // 重置自动播放
        function resetAutoPlay() {
            stopAutoPlay();
            startAutoPlay();
        }


        // 鼠标悬停时暂停自动播放
        track.addEventListener('mouseenter', stopAutoPlay);
        track.addEventListener('mouseleave', startAutoPlay);

        // 初始化轮播
        renderHeroCarousel();
    </script>
</body>
</html>
