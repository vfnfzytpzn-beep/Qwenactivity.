        let currentFilter = { category: 'all', status: 'all' };

        function getStatusLabel(status, isHot) {
            let label = '';
            if (isHot) label += '<span class="exhibit-badge exhibit-badge-hot">🔥 热门</span>';
            switch (status) {
                case 'ongoing': label += '<span class="exhibit-badge exhibit-badge-ongoing">进行中</span>'; break;
                case 'upcoming': label += '<span class="exhibit-badge exhibit-badge-upcoming">即将开始</span>'; break;
            }
            return label;
        }

        function renderExhibitions() {
            const filtered = exhibitionData.filter(item => {
                let match = true;
                if (currentFilter.category !== 'all') match = match && item.category === currentFilter.category;
                if (currentFilter.status === 'hot') match = match && item.hot;
                else if (currentFilter.status === 'upcoming') match = match && item.status === 'upcoming';
                else if (currentFilter.status === 'ongoing') match = match && item.status === 'ongoing';
                return match;
            });

            const grid = document.getElementById('exhibitionGrid');
            const emptyState = document.getElementById('emptyState');
            const loadingState = document.getElementById('loadingState');
            const countEl = document.getElementById('exhibitCount');

            countEl.textContent = exhibitionData.length;
            loadingState.style.display = 'none';

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            grid.innerHTML = filtered.map(exhibit => `
                <div class="flip-card" data-id="${exhibit.id}">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <div class="exhibit-cover">
                                <img src="${exhibit.cover}" alt="${exhibit.title}" onerror="this.style.display='none'; this.parentNode.classList.add('cover-fallback');">
                                <div class="cover-overlay"></div>
                                <div class="exhibit-badges">${getStatusLabel(exhibit.status, exhibit.hot)}</div>
                                <div class="exhibit-cover-info">
                                    <h3>${exhibit.title}</h3>
                                    <p class="exhibit-date">📅 ${exhibit.date}</p>
                                </div>
                            </div>
                        </div>
                        <div class="flip-card-back">
                            <div class="exhibit-detail">
                                <h3>${exhibit.title}</h3>
                                <div class="exhibit-meta">
                                    <div class="meta-item"><span class="meta-icon">📅</span><span>${exhibit.date}</span></div>
                                    <div class="meta-item"><span class="meta-icon">📍</span><span>${exhibit.location}</span></div>
                                    ${exhibit.area !== '-' ? `<div class="meta-item"><span class="meta-icon">📐</span><span>规模：${exhibit.area}</span></div>` : ''}
                                    <div class="meta-item"><span class="meta-icon">👥</span><span>预计参与：${exhibit.visitors}</span></div>
                                    <div class="meta-item"><span class="meta-icon">🏢</span><span>${exhibit.organizer}</span></div>
                                </div>
                                <div class="exhibit-tags">
                                    ${exhibit.tags.map(tag => `<span class="exhibit-tag">${tag}</span>`).join('')}
                                </div>
                                <div class="exhibit-source">来源：${exhibit.source}</div>
                                <div class="exhibit-actions">
                                    <button class="btn btn-primary btn-sm" onclick="openExhibitModal('${exhibit.id}')">查看详情</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openExhibitModal(id) {
            const exhibit = exhibitionData.find(e => e.id === id);
            if (!exhibit) return;
            document.getElementById('modalTitle').textContent = exhibit.title;
            document.getElementById('modalBody').innerHTML = `
                <div class="modal-exhibit-cover">
                    <img src="${exhibit.cover}" alt="${exhibit.title}" onerror="this.style.display='none'">
                </div>
                <div class="modal-exhibit-info">
                    <div class="info-grid">
                        <div class="info-item"><strong>📅 时间：</strong>${exhibit.date}</div>
                        <div class="info-item"><strong>📍 地点：</strong>${exhibit.location}</div>
                        ${exhibit.area !== '-' ? `<div class="info-item"><strong>📐 规模：</strong>${exhibit.area}</div>` : ''}
                        <div class="info-item"><strong>👥 参与：</strong>${exhibit.visitors}</div>
                        <div class="info-item"><strong>🏢 主办方：</strong>${exhibit.organizer}</div>
                        <div class="info-item"><strong>🏷️ 分类：</strong>${exhibit.category}</div>
                        <div class="info-item"><strong>🔗 来源：</strong><a href="${exhibit.sourceUrl}" target="_blank" rel="noopener" class="source-link">${exhibit.source}</a></div>
                    </div>
                    <div class="info-desc">
                        <strong>📋 活动简介：</strong>
                        <p>${exhibit.description}</p>
                    </div>
                    <div class="exhibit-tags" style="margin-top:16px;">
                        ${exhibit.tags.map(tag => `<span class="exhibit-tag">${tag}</span>`).join('')}
                    </div>
                </div>
            `;
            document.getElementById('exhibitModal').classList.add('active');
        }

        function closeExhibitModal() {
            document.getElementById('exhibitModal').classList.remove('active');
        }

        document.getElementById('exhibitModal').addEventListener('click', function(e) {
            if (e.target === this) closeExhibitModal();
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter.category = this.dataset.category;
                renderExhibitions();
            });
        });

        document.querySelectorAll('.filter-btn-status').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn-status').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter.status = this.dataset.status;
                renderExhibitions();
            });
        });

        setTimeout(renderExhibitions, 600);
    </script>
