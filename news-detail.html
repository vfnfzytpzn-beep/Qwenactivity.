<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资讯详情 - 通义大模型生态赋能中心</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <div class="logo-icon">通</div>
            <div class="logo-text-wrap">
                <span class="logo-text">通义大模型生态赋能中心</span>
                <span class="logo-subtitle">全国首个集技术、运营、场景创新于一体的生态赋能中心</span>
            </div>
        </a>
        <div class="nav-links">
            <a href="index.html">活动首页</a>
            <a href="publish.html">发布活动</a>
            <a href="admin.html">后台管理</a>
            <a href="qwen.html">关于千问</a>
        </div>
    </nav>

    <!-- 资讯详情头部 -->
    <section class="detail-header" id="detailHeader">
        <div class="container">
            <div style="margin-bottom:12px;">
                <span class="news-tag" id="newsTag" style="font-size:13px;"></span>
            </div>
            <h1 id="newsTitle">加载中...</h1>
            <div class="detail-meta" id="newsMeta"></div>
        </div>
    </section>

    <!-- 资讯详情内容 -->
    <section class="detail-content">
        <div class="container">
            <div class="detail-body">
                <!-- 摘要 -->
                <div id="newsSummary" style="margin-bottom:24px; padding:16px 20px; background:rgba(19,102,236,0.04); border-left:4px solid #1366EC; border-radius:0 8px 8px 0; color:#262626; font-size:15px; line-height:1.8;"></div>

                <!-- 正文 -->
                <h2>详细内容</h2>
                <div class="desc" id="newsContent"></div>

                <!-- 原文链接 -->
                <div id="newsSourceLink" style="margin-top:24px;"></div>

                <!-- 操作按钮 -->
                <div style="margin-top:40px; display:flex; gap:12px;">
                    <a href="index.html" class="btn btn-outline">返回首页</a>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 通义大模型生态赋能中心 | 活动资讯平台</p>
        </div>
    </footer>

    <script src="events-data.js"></script>
    <script src="app.js"></script>
    <script>
        function loadNewsDetail() {
            const id = Utils.getUrlParam('id');
            if (!id) {
                document.getElementById('newsTitle').textContent = '资讯不存在';
                return;
            }

            const news = getNewsById(id);
            if (!news) {
                document.getElementById('newsTitle').textContent = '资讯不存在';
                document.getElementById('newsContent').textContent = '该资讯可能已被删除或链接无效。';
                return;
            }

            // 设置页面标题
            document.title = `${news.title} - AI实时资讯`;

            // 渲染标签
            const tagEl = document.getElementById('newsTag');
            tagEl.textContent = news.tag;
            tagEl.className = `news-tag ${news.tagClass || ''}`;

            // 渲染标题
            document.getElementById('newsTitle').textContent = news.title;

            // 渲染元信息
            document.getElementById('newsMeta').innerHTML = `
                <span>🕐 ${news.time}</span>
                <span>📰 来源：${news.source}</span>
            `;

            // 渲染摘要
            document.getElementById('newsSummary').textContent = news.summary || '';

            // 渲染正文（处理换行）
            const contentEl = document.getElementById('newsContent');
            const paragraphs = (news.content || '').split('\n\n');
            contentEl.innerHTML = paragraphs.map(p => `<p style="margin-bottom:16px; line-height:1.9; color:#333;">${p.replace(/\n/g, '<br>')}</p>`).join('');

            // 渲染来源链接
            if (news.sourceUrl) {
                document.getElementById('newsSourceLink').innerHTML = `
                    <a href="${news.sourceUrl}" target="_blank" rel="noopener" style="color:#1366EC; text-decoration:none; font-size:14px;">
                        🔗 查看原文链接（${news.source}）→
                    </a>
                `;
            }
        }

        loadNewsDetail();
    </script>
</body>
</html>
